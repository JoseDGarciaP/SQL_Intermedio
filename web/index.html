<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SQL Intermedio</title>
    <meta name="description" content="Aprende Joins, Funciones Agregadas y Subconsultas en PostgreSQL y practica con consultas reales. UFPSO - GIPCO." />
    <meta name="theme-color" content="#0564B1" />
    <script>
      // Aplica el tema antes de pintar para evitar un destello del tema equivocado.
      (function () {
        var t = null;
        try { t = localStorage.getItem('sqli-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A2654');
      })();
    </script>
    <link rel="icon" type="image/png" href="./images/sql2.png" />
    <link rel="apple-touch-icon" href="./images/sql2.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
